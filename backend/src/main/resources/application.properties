spring.application.name=pokedex
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:mem:pokedex;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.cache.type=simple
app.security.jwt.secret=${JWT_SECRET:local-development-signing-secret-change-before-deploy-123456}
